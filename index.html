<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" class="rel">
</head>

<body>
    <div class="wrapper">
        <div class="coutdown-cointainer">

            <H1>We're launching soon</H1>
            <br>
            <main>
                <div class="grid-cell">
                    <div class="card">
                        <div class="card_top">
                            <span class="card_top_number secund">08</span>
                            <svg>
                                <circle r="6" cy="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cy="100%" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                        <hr>
                        <div class="card_bottom"
                            style="transition: none; transform: rotateX(0deg); background-color: rgb(red, green, blue);">
                            <span class="card_to_number secund"
                                style="transition: none; transform: translate(-50%, -50%);  color: rgb(red, green, blue);">
                            </span>
                            </span>
                            <svg>
                                <circle r="6" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>


                        </div>
                        <div class="card__bottom-bg">
                            <span class="card__bottom-bg__number secund">08</span>
                            <svg>
                                <circle r="6" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>

                        </div>
                        <span class="label">Seconds</span>
                    </div>


                </div>
                <div class="grid-cell">
                    <div class="card">
                        <div class="card_top">
                            <span class="card_top_number minute">08</span>
                            <svg>
                                <circle r="6" cy="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cy="100%" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                        <hr>
                        <div class="card__bottom"
                            style="transition: none; transform: rotateX('0deg'); background-color: rgb(red, green, blue);">


                            <span class="card_to_number minute  "
                                style="transition: none; transform: translate(-50%, -50%);  color: rgb(red, green, blue);">
                            </span>
                            </span>
                            <svg>
                                <circle r="6" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                    </div>

                    <span class="label">minute</span>
                </div>
                 <div class="grid-cell">
                    <div class="card">
                        <div class="card_top">
                            <span class="card_top_number hours">08</span>
                            <svg>
                                <circle r="6" cy="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cy="100%" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                        <hr>
                        <div class="card__bottom"
                            style="transition: none; transform: rotateX('0deg'); background-color: rgb(red, green, blue);">


                            <span class="card_to_number hours "
                                style="transition: none; transform: translate(-50%, -50%);  color: rgb(red, green, blue);">
                            </span>
                            </span>
                            <svg>
                                <circle r="6" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                    </div>

                    <span class="label">hours</span>
                </div>
                <div class="grid-cell">
                    <div class="card">
                        <div class="card_top">
                            <span class="card_top_number days">08</span>
                            <svg>
                                <circle r="6" cy="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cy="100%" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                        <hr>
                        <div class="card__bottom"
                            style="transition: none; transform: rotateX('0deg'); background-color: rgb(red, green, blue);">


                            <span class="card_to_number days "
                                style="transition: none; transform: translate(-50%, -50%);  color: rgb(red, green, blue);">
                            </span>
                            </span>
                            <svg>
                                <circle r="6" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                                <circle r="6" cx="100%" fill="hsl(234, 17%, 12%)" style="r: 6px;"></circle>
                            </svg>
                        </div>
                    </div>

                    <span class="label">days</span>
                </div>
            </main>
        </div>
    </div>
    <script src="apps.js"></script>
    
</body>

</html>
